name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one-time research sync
        run: |
          if [ -f .github/scripts/apply_research_sync.py ]; then
            git remote add upstream https://github.com/holodreams123-afk/holodream.git || true
            git fetch upstream main --depth=1
            git show upstream/main:src/data/gameData.json > src/data/gameData.json
            git show upstream/main:src/data/star5-bloom.json > src/data/star5-bloom.json
            git show upstream/main:src/lib/bloom.ts > src/lib/bloom.ts
            if [ -f .github/scripts/prepare_research_sync.py ]; then
              python3 .github/scripts/prepare_research_sync.py
            fi
            set +e
            python3 .github/scripts/apply_research_sync.py > /tmp/research-sync.log 2>&1
            status=$?
            set -e
            cat /tmp/research-sync.log
            if [ "$status" -ne 0 ]; then
              cp /tmp/research-sync.log .github/research-sync-failure.log
              git config user.name "D4C1207"
              git config user.email "s1113708@mail.yzu.edu.tw"
              git add .github/research-sync-failure.log
              if ! git diff --cached --quiet; then
                git commit -m "Record research sync failure"
                git push origin HEAD:main
              fi
              exit "$status"
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          set +e
          npm run build > /tmp/research-build.log 2>&1
          status=$?
          set -e
          cat /tmp/research-build.log
          if [ "$status" -ne 0 ] && [ -f .github/scripts/apply_research_sync.py ]; then
            cp /tmp/research-build.log .github/research-build-failure.log
            git config user.name "D4C1207"
            git config user.email "s1113708@mail.yzu.edu.tw"
            git add .github/research-build-failure.log
            if ! git diff --cached --quiet; then
              git commit -m "Record research build failure"
              git push origin HEAD:main
            fi
          fi
          exit "$status"
        env:
          VITE_BASE: /holodream123/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Persist verified research sync
        run: |
          if [ -f .github/scripts/apply_research_sync.py ]; then
            rm -f .github/scripts/apply_research_sync.py
            rm -f .github/scripts/prepare_research_sync.py
            rm -f .github/research-sync-failure.log
            rm -f .github/research-build-failure.log
            git config user.name "D4C1207"
            git config user.email "s1113708@mail.yzu.edu.tw"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Sync Bloom and researched scoring mechanics"
              git push origin HEAD:main
            fi
          fi
