name: D4C feature upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/d4c-code-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d4c-code-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild and verify patch
        shell: bash
        run: |
          cat .d4c-patch/01 .d4c-patch/02 .d4c-patch/03 .d4c-patch/04 .d4c-patch/05 .d4c-patch/06 .d4c-patch/07 .d4c-patch/08 .d4c-patch/09 .d4c-patch/10 .d4c-patch/11 .d4c-patch/12 .d4c-patch/13a .d4c-patch/13b1 .d4c-patch/13b2 .d4c-patch/14 | base64 -d > /tmp/d4c.patch
          echo "5122831f0c724fabd08149bc2af355f8567066f47af5e210623946012784a5f9  /tmp/d4c.patch" | sha256sum -c -

      - name: Rebuild files from verified hunks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path('/tmp/d4c.patch').read_text(encoding='utf-8').splitlines(keepends=True)
          files = []
          current = None
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith('diff --git '):
                  m = re.match(r'diff --git a/(.*?) b/(.*?)\n?$', line)
                  if not m:
                      raise RuntimeError(f'Bad diff header: {line!r}')
                  current = {'path': m.group(2), 'new_file': False, 'hunks': []}
                  files.append(current)
                  i += 1
                  continue
              if current is not None and line.startswith('new file mode '):
                  current['new_file'] = True
                  i += 1
                  continue
              if current is not None and line.startswith('@@ '):
                  m = re.match(r'@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@', line)
                  if not m:
                      raise RuntimeError(f'Bad hunk header: {line!r}')
                  old_start = int(m.group(1))
                  body = []
                  i += 1
                  while i < len(lines):
                      row = lines[i]
                      if row.startswith('@@ ') or row.startswith('diff --git '):
                          break
                      if row.startswith('\\ No newline'):
                          i += 1
                          continue
                      if not row or row[0] not in ' +-':
                          break
                      body.append(row)
                      i += 1
                  current['hunks'].append((old_start, body))
                  continue
              i += 1

          staged = {}
          for fp in files:
              path = Path(fp['path'])
              original = [] if fp['new_file'] else path.read_text(encoding='utf-8').splitlines(keepends=True)
              out = []
              cursor = 0
              for hunk_no, (old_start, body) in enumerate(fp['hunks'], 1):
                  start = 0 if fp['new_file'] else max(0, old_start - 1)
                  if start < cursor:
                      raise RuntimeError(f"{fp['path']} hunk {hunk_no}: overlapping old ranges")
                  out.extend(original[cursor:start])
                  pos = start
                  for row in body:
                      mark, payload = row[0], row[1:]
                      if mark == '+':
                          out.append(payload)
                          continue
                      if pos >= len(original):
                          raise RuntimeError(f"{fp['path']} hunk {hunk_no}: old file ended early")
                      if original[pos] != payload:
                          raise RuntimeError(
                              f"{fp['path']} hunk {hunk_no}: line mismatch at old line {pos+1}\n"
                              f"expected={payload!r}\nactual={original[pos]!r}"
                          )
                      if mark == ' ':
                          out.append(payload)
                      pos += 1
                  cursor = pos
              out.extend(original[cursor:])
              staged[path] = ''.join(out)

          for path, text in staged.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
              print(f'Rebuilt {path}: {len(text)} chars')
          PY
          test -f src/lib/rosterProfiles.ts
          grep -q 'bootstrapRosterProfiles' src/App.tsx
          grep -q 'autoCaptainInventory' src/lib/optimizer.ts
          grep -q 'roster-account-bar' src/styles.css

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build verification
        shell: bash
        env:
          VITE_BASE: /holodream123/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Commit verified feature changes
        shell: bash
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          rm -f d4c.patch.b64
          rm -rf .d4c-patch
          rm -f .github/workflows/d4c-code-upgrade.yml
          rm -f .github/workflows/d4c-hash-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Add D4C multi-account roster optimizer"
          git push origin HEAD:main
