name: D4C feature upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/d4c-code-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d4c-code-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild and verify patch
        shell: bash
        run: |
          cat .d4c-patch/01 .d4c-patch/02 .d4c-patch/03 .d4c-patch/04 .d4c-patch/05 .d4c-patch/06 .d4c-patch/07 .d4c-patch/08 .d4c-patch/09 .d4c-patch/10 .d4c-patch/11 .d4c-patch/12 .d4c-patch/13a .d4c-patch/13b1 .d4c-patch/13b2 .d4c-patch/14 | base64 -d > /tmp/d4c.patch
          echo "5122831f0c724fabd08149bc2af355f8567066f47af5e210623946012784a5f9  /tmp/d4c.patch" | sha256sum -c -

      - name: Apply patch bottom-up by exact source matching
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = Path('/tmp/d4c.patch').read_text(encoding='utf-8').splitlines(keepends=True)
          files = []
          current = None
          i = 0
          while i < len(patch):
              line = patch[i]
              if line.startswith('diff --git '):
                  m = re.match(r'diff --git a/(.*?) b/(.*?)\n?$', line)
                  if not m:
                      raise RuntimeError(f'Bad diff header: {line!r}')
                  current = {'path': m.group(2), 'new': False, 'hunks': []}
                  files.append(current)
                  i += 1
                  continue
              if current is not None and line.startswith('new file mode '):
                  current['new'] = True
                  i += 1
                  continue
              if current is not None and line.startswith('@@ '):
                  i += 1
                  old_lines, new_lines = [], []
                  while i < len(patch):
                      body = patch[i]
                      if body.startswith('@@ ') or body.startswith('diff --git '):
                          break
                      if body.startswith('\\ No newline'):
                          i += 1
                          continue
                      if not body or body[0] not in ' +-':
                          break
                      payload = body[1:]
                      if body[0] in ' -': old_lines.append(payload)
                      if body[0] in ' +': new_lines.append(payload)
                      i += 1
                  current['hunks'].append((''.join(old_lines), ''.join(new_lines)))
                  continue
              i += 1

          staged = {}
          errors = []
          for fp in files:
              target = Path(fp['path'])
              if fp['new']:
                  expected = ''.join(new for _, new in fp['hunks'])
                  if target.exists() and target.read_text(encoding='utf-8') != expected:
                      errors.append(f"{fp['path']}: new file already exists with different content")
                  else:
                      staged[target] = expected
                  continue

              if not target.exists():
                  errors.append(f"{fp['path']}: target missing")
                  continue
              text = target.read_text(encoding='utf-8')
              total = len(fp['hunks'])
              for reverse_index, (old, new) in enumerate(reversed(fp['hunks']), 1):
                  hunk_no = total - reverse_index + 1
                  old_count = text.count(old) if old else 0
                  new_count = text.count(new) if new else 0
                  if old_count == 1:
                      text = text.replace(old, new, 1)
                  elif old_count == 0 and new_count == 1:
                      pass
                  else:
                      errors.append(f"{fp['path']}: hunk {hunk_no} old={old_count} new={new_count}")
              staged[target] = text

          if errors:
              raise RuntimeError('Preflight failed:\n- ' + '\n- '.join(errors))
          for target, text in staged.items():
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
              print(f'Applied {target}')
          PY
          test -f src/lib/rosterProfiles.ts
          grep -q 'bootstrapRosterProfiles' src/App.tsx
          grep -q 'autoCaptainInventory' src/lib/optimizer.ts
          grep -q 'roster-account-bar' src/styles.css

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build verification
        shell: bash
        env:
          VITE_BASE: /holodream123/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Commit verified feature changes
        shell: bash
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          rm -f d4c.patch.b64
          rm -rf .d4c-patch
          rm -f .github/workflows/d4c-code-upgrade.yml
          rm -f .github/workflows/d4c-hash-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Add D4C multi-account roster optimizer"
          git push origin HEAD:main
