name: D4C feature upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/d4c-code-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d4c-code-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild and verify patch
        shell: bash
        run: |
          cat .d4c-patch/01 .d4c-patch/02 .d4c-patch/03 .d4c-patch/04 .d4c-patch/05 .d4c-patch/06 .d4c-patch/07 .d4c-patch/08 .d4c-patch/09 .d4c-patch/10 .d4c-patch/11 .d4c-patch/12 .d4c-patch/13 .d4c-patch/14 | base64 -d > /tmp/d4c.patch
          echo "5122831f0c724fabd08149bc2af355f8567066f47af5e210623946012784a5f9  /tmp/d4c.patch" | sha256sum -c -
          git apply --check /tmp/d4c.patch
          git apply /tmp/d4c.patch
          test -f src/lib/rosterProfiles.ts
          grep -q 'bootstrapRosterProfiles' src/App.tsx
          grep -q 'autoCaptainInventory' src/lib/optimizer.ts
          grep -q 'roster-account-bar' src/styles.css

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build verification
        shell: bash
        env:
          VITE_BASE: /holodream123/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Commit verified feature changes
        shell: bash
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          rm -f d4c.patch.b64
          rm -rf .d4c-patch
          rm -f .github/workflows/d4c-code-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Add D4C multi-account roster optimizer"
          git push origin HEAD:main
