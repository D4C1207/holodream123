name: Apply Active Special scoring

on:
  push:
    paths:
      - '.github/workflows/apply-active-special-scoring.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoring changes
        run: python3 .github/scripts/apply_active_special_scoring.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build verification
        run: npm run build
        env:
          VITE_BASE: /holodream123/

      - name: Commit verified changes
        run: |
          rm -f .github/workflows/apply-active-special-scoring.yml
          rm -f .github/scripts/apply_active_special_scoring.py
          git config user.name "D4C1207"
          git config user.email "s1113708@mail.yzu.edu.tw"
          git add src/App.tsx src/components/ManualDeckLab.tsx src/lib/optimizer.ts src/lib/teamDecision.ts src/lib/specialOrder.ts README.md .github/workflows/apply-active-special-scoring.yml .github/scripts/apply_active_special_scoring.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use Active and Special synergy in PR scoring"
          git push origin HEAD:main
