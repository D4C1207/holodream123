name: Add team favorites UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-team-favorites.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply favorites UI migration
        run: python3 .github/scripts/add_team_favorites_ui.py

      - name: Verify favorites markers
        shell: bash
        run: |
          grep -q 'theme === "favorites"' src/App.tsx
          grep -q 'loadTeamFavorites' src/App.tsx
          grep -q 'saveCurrentTeam' src/App.tsx
          grep -q 'favorite-account-tag' src/App.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build verification
        env:
          VITE_BASE: /holodream123/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Commit verified favorites UI
        shell: bash
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          rm -f .github/scripts/add_team_favorites_ui.py
          rm -f .github/workflows/add-team-favorites.yml
          git config user.name 'D4C1207'
          git config user.email 's1113708@mail.yzu.edu.tw'
          git add -A
          git diff --cached --stat
          git commit -m 'Add cross-account saved team overview'
          git push origin HEAD:main
