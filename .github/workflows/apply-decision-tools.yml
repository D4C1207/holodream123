name: Apply D4C decision tools

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-decision-tools.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply decision tools
        run: python3 .github/scripts/add_decision_tools.py

      - name: Verify decision features
        shell: bash
        run: |
          grep -q 'd4cBattleIndex' src/App.tsx
          grep -q '為什麼是這隊' src/App.tsx
          grep -q '如果我有這張卡呢' src/App.tsx
          grep -q '完整備份' src/App.tsx
          grep -q 'account-dashboard' src/App.tsx
          grep -q 'compare-zone' src/App.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build verification
        env:
          VITE_BASE: /holodream123/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Commit verified decision tools
        shell: bash
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          rm -f .github/scripts/add_decision_tools.py
          rm -f .github/workflows/apply-decision-tools.yml
          git config user.name 'D4C1207'
          git config user.email 's1113708@mail.yzu.edu.tw'
          git add -A
          git diff --cached --stat
          git commit -m 'Add D4C decision support tools'
          git push origin HEAD:main

# retry after strict TypeScript compatibility fix
