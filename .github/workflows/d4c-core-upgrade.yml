name: D4C core feature upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/d4c-core-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d4c-core-feature-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild verified feature patch
        shell: bash
        run: |
          cat .d4c-patch/01 .d4c-patch/02 .d4c-patch/03 .d4c-patch/04 .d4c-patch/05 .d4c-patch/06 .d4c-patch/07 .d4c-patch/08 .d4c-patch/09 .d4c-patch/10 .d4c-patch/11 .d4c-patch/12 .d4c-patch/13a .d4c-patch/13b1 .d4c-patch/13b2 .d4c-patch/14 | base64 -d > /tmp/d4c-features.patch
          echo "5122831f0c724fabd08149bc2af355f8567066f47af5e210623946012784a5f9  /tmp/d4c-features.patch" | sha256sum -c -

      - name: Apply core feature patch
        shell: bash
        run: |
          patch -p1 --forward --batch --fuzz=3 < /tmp/d4c-features.patch
          if find src -name '*.rej' -print -quit | grep -q .; then
            echo 'Patch produced reject files.' >&2
            find src -name '*.rej' -print >&2
            exit 1
          fi

          test -f src/lib/rosterProfiles.ts
          grep -q 'bootstrapRosterProfiles' src/App.tsx
          grep -q 'autoCaptainInventory' src/lib/optimizer.ts
          grep -q 'roster-account-bar' src/styles.css
          grep -q 'ownedCostumeIds' src/App.tsx
          echo 'Core feature markers verified.'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build verification
        shell: bash
        env:
          VITE_BASE: /holodream123/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Commit verified core features
        shell: bash
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          rm -rf .d4c-patch
          rm -f .github/workflows/d4c-core-upgrade.yml
          git config user.name 'D4C1207'
          git config user.email 's1113708@mail.yzu.edu.tw'
          git add src/App.tsx src/lib/optimizer.ts src/lib/rosterProfiles.ts src/styles.css .d4c-patch .github/workflows/d4c-core-upgrade.yml
          git diff --cached --stat
          git commit -m 'Add multi-account inventory and automatic team optimization'
          git push origin HEAD:main
