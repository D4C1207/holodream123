name: D4C core feature upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/d4c-core-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: d4c-core-feature-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild verified feature patch
        shell: bash
        run: |
          cat .d4c-patch/01 .d4c-patch/02 .d4c-patch/03 .d4c-patch/04 .d4c-patch/05 .d4c-patch/06 .d4c-patch/07 .d4c-patch/08 .d4c-patch/09 .d4c-patch/10 .d4c-patch/11 .d4c-patch/12 .d4c-patch/13a .d4c-patch/13b1 .d4c-patch/13b2 .d4c-patch/14 | base64 -d > /tmp/d4c-full.patch
          echo "5122831f0c724fabd08149bc2af355f8567066f47af5e210623946012784a5f9  /tmp/d4c-full.patch" | sha256sum -c -

      - name: Apply core features deterministically
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from difflib import SequenceMatcher
          import re

          patch_lines = Path('/tmp/d4c-full.patch').read_text(encoding='utf-8').splitlines(keepends=True)

          files = []
          current = None
          i = 0
          while i < len(patch_lines):
              line = patch_lines[i]
              if line.startswith('diff --git '):
                  m = re.match(r'diff --git a/(.*?) b/(.*?)\n?$', line)
                  if not m:
                      raise SystemExit(f'Bad diff header: {line.rstrip()}')
                  current = {'path': m.group(2), 'hunks': []}
                  files.append(current)
                  i += 1
                  continue
              if current and line.startswith('@@ '):
                  m = re.match(r'@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@', line)
                  if not m:
                      raise SystemExit(f'Bad hunk header: {line.rstrip()}')
                  old_start = int(m.group(1))
                  i += 1
                  old, new = [], []
                  while i < len(patch_lines):
                      body = patch_lines[i]
                      if body.startswith('diff --git ') or body.startswith('@@ '):
                          break
                      if body.startswith('\\ No newline at end of file'):
                          i += 1
                          continue
                      if body.startswith(('--- ', '+++ ', 'index ', 'new file mode ')):
                          break
                      if not body or body[0] not in ' +-':
                          break
                      payload = body[1:]
                      if body[0] in ' -':
                          old.append(payload)
                      if body[0] in ' +':
                          new.append(payload)
                      i += 1
                  current['hunks'].append((old_start, old, new))
                  continue
              i += 1

          # rosterProfiles.ts is already committed directly and is intentionally skipped here.
          files = [f for f in files if f['path'] != 'src/lib/rosterProfiles.ts']

          for fp in files:
              path = Path(fp['path'])
              if not path.exists():
                  raise SystemExit(f'{path}: target missing')
              original = path.read_text(encoding='utf-8').splitlines(keepends=True)
              edits = []

              for hnum, (old_start, old, new) in enumerate(fp['hunks'], 1):
                  if not old:
                      raise SystemExit(f'{path}: unexpected empty old hunk {hnum}')

                  matches = []
                  max_start = len(original) - len(old)
                  for pos in range(max_start + 1):
                      if original[pos:pos + len(old)] == old:
                          matches.append(pos)
                  if not matches:
                      # If this exact transformation is already present, no edit is needed.
                      new_matches = []
                      max_new = len(original) - len(new)
                      for pos in range(max_new + 1):
                          if original[pos:pos + len(new)] == new:
                              new_matches.append(pos)
                      if new_matches:
                          print(f'{path}: hunk {hnum} already present')
                          continue
                      raise SystemExit(f'{path}: source block for hunk {hnum} not found')

                  expected = max(0, old_start - 1)
                  pos = min(matches, key=lambda p: abs(p - expected))

                  matcher = SequenceMatcher(a=old, b=new, autojunk=False)
                  for tag, i1, i2, j1, j2 in matcher.get_opcodes():
                      if tag == 'equal':
                          continue
                      edits.append((pos + i1, pos + i2, tuple(new[j1:j2]), hnum))

              # Deduplicate identical edits produced by overlapping hunk context.
              dedup = {}
              for start, end, repl, hnum in edits:
                  key = (start, end, repl)
                  dedup[key] = min(hnum, dedup.get(key, hnum))
              edits = [(s, e, list(r), h) for (s, e, r), h in dedup.items()]

              # Reject only actual conflicting edits; shared context is harmless.
              ordered = sorted(edits, key=lambda x: (x[0], x[1]))
              for a, b in zip(ordered, ordered[1:]):
                  a_start, a_end, a_repl, a_h = a
                  b_start, b_end, b_repl, b_h = b
                  overlap = b_start < a_end
                  same_insert = a_start == a_end == b_start == b_end
                  if overlap or same_insert:
                      if not (a_start == b_start and a_end == b_end and a_repl == b_repl):
                          raise SystemExit(
                              f'{path}: conflicting edits from hunks {a_h} and {b_h} at {a_start}:{a_end}/{b_start}:{b_end}'
                          )

              text = original[:]
              for start, end, repl, hnum in sorted(edits, key=lambda x: (x[0], x[1]), reverse=True):
                  text[start:end] = repl
              path.write_text(''.join(text), encoding='utf-8')
              print(f'{path}: applied {len(edits)} actual edits from {len(fp["hunks"])} hunks')
          PY

          test -f src/lib/rosterProfiles.ts
          grep -q 'bootstrapRosterProfiles' src/App.tsx
          grep -q 'autoCaptainInventory' src/lib/optimizer.ts
          grep -q 'roster-account-bar' src/styles.css
          grep -q 'ownedCostumeIds' src/App.tsx
          grep -q 'fixedLeader: null' src/App.tsx
          grep -q 'useDeferredValue' src/App.tsx
          echo 'Core feature markers verified.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        shell: bash
        env:
          VITE_BASE: /holodream123/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Commit verified core features
        shell: bash
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          rm -rf .d4c-patch
          rm -f .github/workflows/d4c-core-upgrade.yml
          git config user.name 'D4C1207'
          git config user.email 's1113708@mail.yzu.edu.tw'
          git add -A
          git diff --cached --stat
          git commit -m 'Add multi-account inventory and automatic team optimization'
          git push origin HEAD:main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
