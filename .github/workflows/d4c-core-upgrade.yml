name: D4C core feature upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/d4c-core-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: d4c-core-feature-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild verified feature patch
        shell: bash
        run: |
          cat .d4c-patch/01 .d4c-patch/02 .d4c-patch/03 .d4c-patch/04 .d4c-patch/05 .d4c-patch/06 .d4c-patch/07 .d4c-patch/08 .d4c-patch/09 .d4c-patch/10 .d4c-patch/11 .d4c-patch/12 .d4c-patch/13a .d4c-patch/13b1 .d4c-patch/13b2 .d4c-patch/14 | base64 -d > /tmp/d4c-full.patch
          echo "5122831f0c724fabd08149bc2af355f8567066f47af5e210623946012784a5f9  /tmp/d4c-full.patch" | sha256sum -c -

      - name: Apply core features with safe fuzz
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from difflib import SequenceMatcher
          import re

          patch = Path('/tmp/d4c-full.patch').read_text(encoding='utf-8').splitlines(keepends=True)
          files = []
          current = None
          i = 0
          while i < len(patch):
              line = patch[i]
              if line.startswith('diff --git '):
                  m = re.match(r'diff --git a/(.*?) b/(.*?)\n?$', line)
                  if not m:
                      raise SystemExit(f'bad diff header: {line.rstrip()}')
                  current = {'path': m.group(2), 'hunks': []}
                  files.append(current)
                  i += 1
                  continue
              if current and line.startswith('@@ '):
                  m = re.match(r'@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@', line)
                  if not m:
                      raise SystemExit(f'bad hunk header: {line.rstrip()}')
                  old_start = int(m.group(1))
                  i += 1
                  ops = []
                  while i < len(patch):
                      body = patch[i]
                      if body.startswith('diff --git ') or body.startswith('@@ '):
                          break
                      if body.startswith('\\ No newline at end of file'):
                          i += 1
                          continue
                      if body.startswith(('--- ', '+++ ', 'index ', 'new file mode ')):
                          break
                      if not body or body[0] not in ' +-':
                          break
                      ops.append((body[0], body[1:]))
                      i += 1
                  current['hunks'].append((old_start, ops))
                  continue
              i += 1

          files = [f for f in files if f['path'] != 'src/lib/rosterProfiles.ts']

          def old_new(ops):
              old = [text for kind, text in ops if kind in ' -']
              new = [text for kind, text in ops if kind in ' +']
              return old, new

          def find_matches(haystack, needle):
              if not needle:
                  return []
              limit = len(haystack) - len(needle)
              return [p for p in range(limit + 1) if haystack[p:p + len(needle)] == needle]

          def fuzz_variants(ops, max_fuzz=3):
              lead_context = 0
              while lead_context < len(ops) and ops[lead_context][0] == ' ':
                  lead_context += 1
              trail_context = 0
              while trail_context < len(ops) and ops[len(ops)-1-trail_context][0] == ' ':
                  trail_context += 1
              variants = []
              for total in range(0, max_fuzz * 2 + 1):
                  for lead in range(0, min(max_fuzz, lead_context) + 1):
                      trail = total - lead
                      if trail < 0 or trail > min(max_fuzz, trail_context):
                          continue
                      end = len(ops) - trail if trail else len(ops)
                      trimmed = ops[lead:end]
                      if trimmed:
                          variants.append((lead, trail, trimmed))
              return variants

          for fp in files:
              path = Path(fp['path'])
              original = path.read_text(encoding='utf-8').splitlines(keepends=True)
              edits = []
              for hnum, (old_start, ops) in enumerate(fp['hunks'], 1):
                  chosen = None
                  for lead, trail, trimmed in fuzz_variants(ops):
                      old, new = old_new(trimmed)
                      matches = find_matches(original, old)
                      if matches:
                          expected = max(0, old_start - 1 + lead)
                          pos = min(matches, key=lambda p: abs(p - expected))
                          chosen = (pos, old, new, lead, trail)
                          break
                  if chosen is None:
                      # Idempotency: allow a hunk already present, using the same safe fuzz rule.
                      already = False
                      for lead, trail, trimmed in fuzz_variants(ops):
                          _, new = old_new(trimmed)
                          if new and find_matches(original, new):
                              already = True
                              break
                      if already:
                          print(f'{path}: hunk {hnum} already present')
                          continue
                      raise SystemExit(f'{path}: hunk {hnum} not found even with safe fuzz')

                  pos, old, new, lead, trail = chosen
                  if lead or trail:
                      print(f'{path}: hunk {hnum} matched with fuzz lead={lead} trail={trail}')
                  sm = SequenceMatcher(a=old, b=new, autojunk=False)
                  for tag, i1, i2, j1, j2 in sm.get_opcodes():
                      if tag == 'equal':
                          continue
                      edits.append((pos + i1, pos + i2, tuple(new[j1:j2]), hnum))

              # Deduplicate actual edits. Context-only differences never become edits.
              unique = {}
              for start, end, repl, hnum in edits:
                  unique[(start, end, repl)] = min(hnum, unique.get((start, end, repl), hnum))
              edits = [(s, e, list(r), h) for (s, e, r), h in unique.items()]
              ordered = sorted(edits, key=lambda x: (x[0], x[1]))
              for left, right in zip(ordered, ordered[1:]):
                  ls, le, lr, lh = left
                  rs, re_, rr, rh = right
                  if rs < le or (ls == le == rs == re_):
                      if not (ls == rs and le == re_ and lr == rr):
                          raise SystemExit(f'{path}: conflicting actual edits from hunks {lh} and {rh}')

              output = original[:]
              for start, end, repl, _ in sorted(edits, key=lambda x: (x[0], x[1]), reverse=True):
                  output[start:end] = repl
              path.write_text(''.join(output), encoding='utf-8')
              print(f'{path}: applied {len(edits)} actual edits')
          PY

          test -f src/lib/rosterProfiles.ts
          grep -q 'bootstrapRosterProfiles' src/App.tsx
          grep -q 'autoCaptainInventory' src/lib/optimizer.ts
          grep -q 'roster-account-bar' src/styles.css
          grep -q 'ownedCostumeIds' src/App.tsx
          grep -q 'fixedLeader: null' src/App.tsx
          grep -q 'useDeferredValue' src/App.tsx
          echo 'Core feature markers verified.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        shell: bash
        env:
          VITE_BASE: /holodream123/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Commit verified core features
        shell: bash
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          rm -rf .d4c-patch
          rm -f .github/workflows/d4c-core-upgrade.yml
          git config user.name 'D4C1207'
          git config user.email 's1113708@mail.yzu.edu.tw'
          git add -A
          git diff --cached --stat
          git commit -m 'Add multi-account inventory and automatic team optimization'
          git push origin HEAD:main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
