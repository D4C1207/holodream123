name: D4C patch integrity check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/d4c-hash-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash chunks
        run: sha256sum .d4c-patch/*
