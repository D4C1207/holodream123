name: Apply latest research copy fix

on:
  push:
    paths:
      - '.github/workflows/apply-latest-research-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply copy fixes
        run: python3 .github/scripts/fix_latest_research_copy.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build verification
        run: npm run build
        env:
          VITE_BASE: /holodream123/

      - name: Commit verified changes
        run: |
          rm -f .github/scripts/fix_latest_research_copy.py
          rm -f .github/workflows/apply-latest-research-copy.yml
          git config user.name "D4C1207"
          git config user.email "s1113708@mail.yzu.edu.tw"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Align scoring help text with researched mechanics"
          git push origin HEAD:main
