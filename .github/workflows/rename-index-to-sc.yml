name: Rename score to SC

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rename-index-to-sc.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rename score labels
        run: python3 .github/scripts/rename_index_to_sc.py

      - name: Verify labels
        shell: bash
        run: |
          grep -q '<span className="label">SC</span>' src/App.tsx
          grep -q '<tr><td>SC</td>' src/App.tsx
          grep -q '<strong>SC</strong>' src/App.tsx
          if grep -q 'D4C 實戰指數' src/App.tsx; then
            echo 'Old D4C score label still exists' >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build verification
        env:
          VITE_BASE: /holodream123/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Commit verified rename
        shell: bash
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          rm -f .github/scripts/rename_index_to_sc.py
          rm -f .github/workflows/rename-index-to-sc.yml
          git config user.name 'D4C1207'
          git config user.email 's1113708@mail.yzu.edu.tw'
          git add -A
          git diff --cached --stat
          git commit -m 'Rename D4C battle index to SC'
          git push origin HEAD:main
