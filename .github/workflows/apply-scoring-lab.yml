name: Apply scoring and manual lab

on:
  push:
    paths:
      - '.github/workflows/apply-scoring-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoring and lab changes
        run: python3 .github/scripts/apply_scoring_lab.py

      - name: Remove unused manual lab type import
        run: sed -i 's/Card, CardStats, Costume, GameData, TeamEvaluation/Card, CardStats, GameData, TeamEvaluation/' src/components/ManualDeckLab.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build verification
        run: npm run build
        env:
          VITE_BASE: /holodream123/

      - name: Commit verified changes
        run: |
          rm -f .github/workflows/apply-scoring-lab.yml
          rm -f .github/scripts/apply_scoring_lab.py
          git config user.name "D4C1207"
          git config user.email "s1113708@mail.yzu.edu.tw"
          git add src/App.tsx src/lib/optimizer.ts src/lib/prBaselineStore.ts src/components/ManualDeckLab.tsx src/main.tsx README.md .github/workflows/apply-scoring-lab.yml .github/scripts/apply_scoring_lab.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add ratio PR scoring and manual deck lab"
          git push origin HEAD:main
