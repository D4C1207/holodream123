name: Apply latest Holodream research sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch original author latest data
        run: |
          git remote add upstream https://github.com/holodreams123-afk/holodream.git || true
          git fetch upstream main --depth=1
          git show upstream/main:src/data/gameData.json > src/data/gameData.json
          git show upstream/main:src/data/star5-bloom.json > src/data/star5-bloom.json
          git show upstream/main:src/lib/bloom.ts > src/lib/bloom.ts

      - name: Apply D4C research integration
        run: python3 .github/scripts/apply_research_sync.py

      - name: Verify research markers
        run: |
          grep -q 'activeBaseProbability' src/lib/optimizer.ts
          grep -q 'cardBloomById' src/lib/optimizer.ts
          grep -q 'RosterBloomPanel' src/App.tsx
          grep -q 'RULES_REVIEWED = "2026-08-18"' src/App.tsx
          grep -q 'estimatedScoreSupportPct' src/lib/teamDecision.ts
          test -s src/data/star5-bloom.json
          test -s src/lib/bloom.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build verification
        run: npm run build
        env:
          VITE_BASE: /holodream123/

      - name: Commit verified changes
        run: |
          rm -f .github/workflows/apply-research-sync.yml
          rm -f .github/scripts/apply_research_sync.py
          git config user.name "D4C1207"
          git config user.email "s1113708@mail.yzu.edu.tw"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync Bloom and researched scoring mechanics"
          git push origin HEAD:main
