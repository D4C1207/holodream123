name: D4C auto costume migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/d4c-auto-costume-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update roster ownership logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          text = app_path.read_text(encoding='utf-8')

          def repl(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          repl(
'''const allCardIds = new Set(data.cards.map((c) => c.id));
const allCostumeIds = new Set(data.costumes.map((c) => c.id));
''',
'''const allCardIds = new Set(data.cards.map((c) => c.id));
const allCostumeIds = new Set(data.costumes.map((c) => c.id));
const cardById = new Map(data.cards.map((c) => [c.id, c] as const));
const costumeIdByCardKey = new Map(
  data.costumes.map((c) => [`${c.member}|||${c.costumeName}`, c.id] as const),
);
''',
'card/costume lookup maps',
          )

          repl(
'''          rosterNote: "このゲームアカウントが所持している★5／イベントカードと衣装を登録してください。隊長・衣装・5人編成は自動で選ばれます。",
''',
'''          rosterNote: "このゲームアカウントが所持している★5／イベントカードだけを登録してください。カードに対応する衣装は自動で所持扱いになり、隊長・衣装・5人編成も自動で選ばれます。",
''',
'ja roster note',
          )
          repl(
'''          needCostume: "所持衣装を1つ以上選択してください。",
''',
'''          needCostume: "選択したカードに対応する衣装データが見つかりません。衣装付きの★5／イベントカードを1枚以上選択してください。",
''',
'ja derived costume warning',
          )
          repl(
'''            rosterNote: "Save the ★5/event cards and costumes owned by this game account. Captain, costume, and the five-member team are selected automatically.",
''',
'''            rosterNote: "Save only the ★5/event cards owned by this game account. Each selected card automatically unlocks its matching costume; captain, costume, and the five-member team are selected automatically.",
''',
'en roster note',
          )
          repl(
'''            needCostume: "Select at least one owned costume.",
''',
'''            needCostume: "No matching costume data was found for the selected cards. Select at least one ★5/event card with a linked costume.",
''',
'en derived costume warning',
          )
          repl(
'''            rosterNote: "記錄這個遊戲帳號實際持有的 ★5／活動卡與衣裝；隊長、衣裝與五人編成都會由系統自動挑選。",
''',
'''            rosterNote: "只要記錄這個遊戲帳號實際持有的 ★5／活動卡；勾選卡片後會自動視為擁有該卡對應衣裝，隊長、衣裝與五人編成都由系統自動挑選。",
''',
'zh roster note',
          )
          repl(
'''            needCostume: "請至少選擇一件已持有衣裝。",
''',
'''            needCostume: "目前勾選的卡片找不到可用衣裝資料，請至少勾選一張有對應衣裝的 ★5／活動卡。",
''',
'zh derived costume warning',
          )

          repl(
'''  const rosterSet = useMemo(() => new Set(ownedRosterMembers), [ownedRosterMembers]);
  const rosterCostumeSet = useMemo(() => new Set(ownedRosterCostumeIds), [ownedRosterCostumeIds]);
''',
'''  const rosterSet = useMemo(() => new Set(ownedRosterMembers), [ownedRosterMembers]);
''',
'remove manual costume set',
          )

          repl(
'''  function rosterOwnedCardIdsForOptimize(): Set<string> {
    const ids = new Set<string>();
    for (const member of ownedRosterMembers) {
      for (const id of rosterOwnedIds(member)) ids.add(id);
    }
    return ids;
  }

''',
'''  function rosterOwnedCardIdsForOptimize(): Set<string> {
    const ids = new Set<string>();
    for (const member of ownedRosterMembers) {
      for (const id of rosterOwnedIds(member)) ids.add(id);
    }
    return ids;
  }

  function rosterOwnedCostumeIdsForOptimize(): Set<string> {
    const costumeIds = new Set<string>();
    for (const cardId of rosterOwnedCardIdsForOptimize()) {
      const card = cardById.get(cardId);
      if (!card) continue;
      const costumeId = costumeIdByCardKey.get(`${card.member}|||${card.costumeName}`);
      if (costumeId) costumeIds.add(costumeId);
    }
    return costumeIds;
  }

''',
'derive costumes from cards',
          )

          repl(
'''  const rosterCostumeGroups = useMemo(() => {
    const map = new Map<string, Costume[]>();
    for (const costume of data.costumes) {
      const list = map.get(costume.member) ?? [];
      list.push(costume);
      map.set(costume.member, list);
    }
    return [...map.entries()]
      .sort((a, b) => compareMembersByGroup(a[0], b[0], unitsOf))
      .map(([member, costumes]) => ({
        member,
        costumes: [...costumes].sort((a, b) => b.skill.score - a.skill.score),
      }));
  }, []);

''',
'''''',
'remove costume grouping UI data',
          )

          repl(
'''  function toggleRosterCostume(costumeId: string) {
    setOwnedRosterCostumeIds((prev) => {
      const next = prev.includes(costumeId)
        ? prev.filter((id) => id !== costumeId)
        : [...prev, costumeId];
      persistRosterSnapshot(ownedRosterMembers, rosterOwnedCards, next);
      setResult(null);
      return next;
    });
  }

  function clearRosterCostumes() {
    setOwnedRosterCostumeIds([]);
    persistRosterSnapshot(ownedRosterMembers, rosterOwnedCards, []);
    setResult(null);
  }

''',
'''''',
'remove manual costume handlers',
          )

          repl(
'''  function runRosterOptimize() {
    if (ownedRosterMembers.length < 5) {
      alert(t.alertRosterMin);
      return;
    }
    for (const member of ownedRosterMembers) {
      if (!rosterOwnedIds(member).length) {
        alert(t.alertRosterCardMin);
        return;
      }
    }
    if (!ownedRosterCostumeIds.length) {
      alert(rosterUi.needCostume);
      return;
    }

    setBusy(true);
    void prepareAndRunOptimize(
      rosterOwnedCardIdsForOptimize(),
      {
        ownedCostumeIds: new Set(ownedRosterCostumeIds),
        songLength: SONG_LENGTH,
        fixedLeader: null,
        fixedCostumeId: null,
        fixedMembers: [],
        memberPool: ownedRosterMembers,
        maxResults: 8,
        allowDuplicateSkills,
      },
      false,
    );
  }
''',
'''  function runRosterOptimize() {
    if (ownedRosterMembers.length < 5) {
      alert(t.alertRosterMin);
      return;
    }
    for (const member of ownedRosterMembers) {
      if (!rosterOwnedIds(member).length) {
        alert(t.alertRosterCardMin);
        return;
      }
    }

    const ownedCostumeIds = rosterOwnedCostumeIdsForOptimize();
    if (!ownedCostumeIds.size) {
      alert(rosterUi.needCostume);
      return;
    }

    setBusy(true);
    void prepareAndRunOptimize(
      rosterOwnedCardIdsForOptimize(),
      {
        ownedCostumeIds,
        songLength: SONG_LENGTH,
        fixedLeader: null,
        fixedCostumeId: null,
        fixedMembers: [],
        memberPool: ownedRosterMembers,
        maxResults: 8,
        allowDuplicateSkills,
      },
      false,
    );
  }
''',
'run roster with derived costumes',
          )

          repl(
'''          <div className="roster-costume-pick">
            <div className="panel-head roster-panel-head">
              <div>
                <h3>{rosterUi.costumeTitle}（{ownedRosterCostumeIds.length}）</h3>
                <p className="panel-note">{rosterUi.costumeNote}</p>
              </div>
              <button className="btn btn-ghost" type="button" onClick={clearRosterCostumes}>
                {rosterUi.clearCostumes}
              </button>
            </div>
            <div className="roster-costume-list">
              {rosterCostumeGroups.map(({ member, costumes }) => (
                <div key={member} className="roster-costume-row">
                  <div className="roster-card-pick-label">
                    <Portrait member={member} size="sm" />
                    <MemberName member={member} units={unitsOf(member)} />
                  </div>
                  <div className="roster-costume-options">
                    {costumes.map((costume) => {
                      const owned = rosterCostumeSet.has(costume.id);
                      const card = data.cards.find(
                        (c) => c.member === costume.member && c.costumeName === costume.costumeName,
                      );
                      return (
                        <button
                          key={costume.id}
                          type="button"
                          className={`roster-costume-option ${owned ? "active" : ""}`}
                          aria-pressed={owned}
                          onClick={() => toggleRosterCostume(costume.id)}
                        >
                          {owned && <span className="roster-card-check" aria-hidden>✓</span>}
                          <CardArt cardId={card?.id} alt={costume.costumeName} />
                          <span>{costume.costumeName}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
''',
'''''',
'remove manual costume picker UI',
          )

          app_path.write_text(text, encoding='utf-8')

          msg_path = Path('src/i18n/messages.ts')
          msg = msg_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '"點選你持有的★5角色（含活動卡）。至少 5 人後選隊長；有多張★5者可在下方勾選持有卡面。PR 仍與最強編隊同基準（9999）。"',
                  '"點選你持有的★5角色（含活動卡）。至少選 5 人；有多張卡者可在下方勾選實際持有卡面。每張卡會自動帶入對應衣裝，隊長、衣裝與五人編成都由系統自動挑選。PR 仍與最強編隊同基準（9999）。"',
              ),
              (
                  '"勾選你持有的★5卡面（可多選）；編隊時會從中自動挑最適合的組合。"',
                  '"勾選你持有的★5／活動卡面（可多選）；每張卡會自動視為擁有其對應衣裝，編隊時再自動挑最佳隊長、衣裝與五人組合。"',
              ),
              (
                  '"Select owned ★5 members (incl. event). Need 5+, then captain; check owned cards below if they have multiple ★5s. PR uses Best Team 9999 baseline."',
                  '"Select at least 5 owned ★5/event members and check the cards you actually own. Each selected card automatically unlocks its matching costume; captain, costume, and the five-member lineup are chosen automatically. PR uses the Best Team 9999 baseline."',
              ),
              (
                  '"Check every ★5 you own (multi-select). The optimizer picks the best mix for each team."',
                  '"Check every ★5/event card you own (multi-select). Each card automatically provides its matching costume, and the optimizer picks the best captain, costume, and lineup."',
              ),
              (
                  '"所持の★5メンバー（イベント含む）を選択。5人以上＋キャプテン。★5が複数いる場合は下で所持分をチェック。PRは最強編成と同じ9999基準。"',
                  '"所持している★5／イベントメンバーを5人以上選び、実際に所持するカードをチェックしてください。各カードの対応衣装は自動で所持扱いとなり、キャプテン・衣装・5人編成も自動選択されます。PRは最強編成と同じ9999基準。"',
              ),
              (
                  '"所持している★5をすべてチェック（複数可）。編成時に最適な組み合わせを自動選択します。"',
                  '"所持している★5／イベントカードをすべてチェック（複数可）。各カードの対応衣装も自動で使用可能になり、最適なキャプテン・衣装・編成を選びます。"',
              ),
          ]
          for old, new in replacements:
              count = msg.count(old)
              if count != 1:
                  raise SystemExit(f'messages replacement expected one match, got {count}: {old[:30]}')
              msg = msg.replace(old, new, 1)
          msg_path.write_text(msg, encoding='utf-8')
          PY

          grep -q 'rosterOwnedCostumeIdsForOptimize' src/App.tsx
          grep -q 'ownedCostumeIds,' src/App.tsx
          if grep -q 'className="roster-costume-pick"' src/App.tsx; then
            echo 'Manual costume picker still exists' >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build verification
        env:
          VITE_BASE: /holodream123/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Commit verified change
        shell: bash
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          rm -f .github/workflows/d4c-auto-costume-migration.yml
          git config user.name 'D4C1207'
          git config user.email 's1113708@mail.yzu.edu.tw'
          git add src/App.tsx src/i18n/messages.ts .github/workflows/d4c-auto-costume-migration.yml
          git diff --cached --stat
          git commit -m 'Derive owned costumes from owned cards'
          git push origin HEAD:main
